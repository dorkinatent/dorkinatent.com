title: "Dork In a Tent"
description: "Tips, Tricks, and Workflow topics for DITs"
url: "https://dorkinatent.com"
baseurl: ""
permalink: /:year/:month/:day/:title/

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Pagination
plugins:
  - jekyll-paginate
  - jekyll-seo-tag

paginate: 10
paginate_path: "/blog/page:num/"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CNAME

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Navigation
navigation:
  - title: Blog
    url: /
  - title: About
    url: /about/
  - title: Gear List
    url: /gear-list/
  - title: Podcasts
    url: /podcasts/
  - title: Useful Links
    url: /useful-links/
  - title: Contact
    url: /contact/
